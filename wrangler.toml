# Cloudflare Pages settings of the site: what the API (functions/) can reach. Not published as a site file.
# Secrets never go here: they are set with "npx wrangler pages secret put NAME --project-name dominiko".
# The API reads: TURNSTILE_SECRET, DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET, OWNER_DISCORD_ID and IP_SALT.
# DEV_LOGIN (test accounts with no Discord, see functions/api/auth/dev.js) goes only in .dev.vars, never here or in the secrets
name = "dominiko"
pages_build_output_dir = ".deploy"
compatibility_date = "2026-10-01"

# Accounts, sessions, community teams, likes, reports, the admin log and the Team Builder's short links.
# The tables come from server/migrations: npx wrangler d1 migrations apply dominik --remote (or --local)
[[d1_databases]]
binding = "DB"
database_name = "dominik"
database_id = "add1ebcd-9cb9-4956-9dd9-9936999d2eb4"
migrations_dir = "server/migrations"

[vars]
# Public key of the Turnstile widget (the secret key is the TURNSTILE_SECRET secret)
TURNSTILE_SITE_KEY = "0x4AAAAAAF6XVjCqC8wjRFFx"
